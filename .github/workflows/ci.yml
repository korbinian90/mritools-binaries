name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry and build artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (debug)
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Check clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  compare-julia:
    name: Rust↔Julia parity (informational)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Drift detector — runs the harness, captures numbers, uploads the
    # output tree as an artifact. NOT a gate: today's baseline has
    # documented divergences (see docs/algorithm_provenance.md
    # #baseline-small-dataset), so the harness exits non-zero on the
    # small dataset. The step's role is to surface regressions, not to
    # block PRs. Tighten when parity items in docs/next_steps.md close.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: '1.10'

      - name: Cache cargo registry and build artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: Linux-cargo-

      - name: Cache Julia packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.julia
          key: julia-1.10-${{ hashFiles('test/compare/julia/Manifest.toml') }}
          restore-keys: julia-1.10-

      - name: Build (release)
        run: cargo build --workspace --release

      - name: Instantiate Julia env
        run: julia --project=test/compare/julia test/compare/julia/setup.jl

      - name: Run Rust↔Julia comparison
        continue-on-error: true
        run: |
          test/compare/run_comparison.sh --tolerance 1e-4 --skip-build \
              2>&1 | tee /tmp/comparison.log

      - name: Upload comparison output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mritools-compare-${{ github.sha }}
          path: |
            /tmp/comparison.log
            /tmp/mritools_compare/
          retention-days: 14
