name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Verify Cargo.toml version matches tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag to workspace.package.version
        id: check
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"           # e.g. v0.3.0
          TAG_VERSION="${TAG#v}"             # 0.3.0
          # Read the version line under [workspace.package]; the first
          # `version = "..."` after that header is the source of truth.
          MANIFEST_VERSION=$(awk '
            /^\[workspace\.package\]/ {in_block=1; next}
            /^\[/ {in_block=0}
            in_block && /^version[[:space:]]*=/ {
                split($0, a, "\""); print a[2]; exit
            }' Cargo.toml)
          if [[ -z "$MANIFEST_VERSION" ]]; then
            echo "::error::Could not find workspace.package.version in Cargo.toml"
            exit 1
          fi
          if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "::error::Tag v$TAG_VERSION does not match Cargo.toml version $MANIFEST_VERSION."
            echo "::error::Bump Cargo.toml and re-tag, or delete the tag and try again."
            echo "::error::Use scripts/release.sh to keep them in sync automatically."
            exit 1
          fi
          echo "OK: tag $TAG matches workspace.package.version $MANIFEST_VERSION"
          echo "version=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build release (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            use_cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Cache cargo registry and build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binaries (native)
        if: "!matrix.use_cross"
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Build release binaries (cross)
        if: matrix.use_cross
        run: cross build --workspace --release --target ${{ matrix.target }}

      - name: Create release archive (Linux / macOS)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          ARCHIVE="mritools-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          BINARIES="romeo clearswi mcpc3ds makehomogeneous romeo_mask"
          tar -czf "$ARCHIVE" -C "$BIN_DIR" $BINARIES
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create release archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $BIN_DIR = "target/${{ matrix.target }}/release"
          $ARCHIVE = "mritools-${{ github.ref_name }}-${{ matrix.target }}.zip"
          $binaries = @("romeo.exe","clearswi.exe","mcpc3ds.exe","makehomogeneous.exe","romeo_mask.exe")
          $paths = $binaries | ForEach-Object { Join-Path $BIN_DIR $_ }
          Compress-Archive -Path $paths -DestinationPath $ARCHIVE
          echo "ARCHIVE=$ARCHIVE" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
